<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>利用者最終編集一覧</title>
<style>
body {
    font-family: sans-serif;
    margin: 0;
}
#wrapper {
    display: flex;
}
#sidebar {
    width: 220px;
    min-width: 220px;
    background: #f8f9fa;
    padding: 16px;
    border-right: 1px solid #ccc;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    box-sizing: border-box;
}
#sidebar h2 {
    font-size: 16px;
    margin: 0 0 12px;
}
#sidebar ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
#sidebar li {
    margin-bottom: 6px;
}
#sidebar a {
    text-decoration: none;
    color: #0645ad;
}
#sidebar a:hover {
    text-decoration: underline;
}
#content {
    flex: 1;
    padding: 16px 24px;
    min-width: 0;
}
table {
    border-collapse: collapse;
    margin-bottom: 2em;
}
th, td {
    border: 1px solid #ccc;
    padding: 4px 8px;
    white-space: nowrap;
}
th {
    background: #eee;
}
.table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
#menu-toggle {
    display: none;
    background: #f8f9fa;
    border: 1px solid #ccc;
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
    margin: 8px;
    border-radius: 4px;
}
@media (max-width: 768px) {
    #wrapper {
        flex-direction: column;
    }
    #sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid #ccc;
        display: none;
    }
    #sidebar.open {
        display: block;
    }
    #menu-toggle {
        display: inline-block;
    }
    #content {
        padding: 12px;
    }
    table {
        width: 100%;
    }
    th, td {
        padding: 4px 6px;
    }
}
</style>
</head>
<body>
<button id="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776; 目次</button>
<div id="wrapper">
<nav id="sidebar">
<h2>目次</h2>
<ul>
<li><a href="#suppress">オーバーサイト(suppress)</a></li>
</ul>
</nav>
<div id="content">
<h1>Wikipedia管理者最終編集一覧</h1>
<p>更新日時: 2026-07-10 16:35:20 JST </p>
<p style="color:#c00;font-weight:bold">※赤色の背景は最終編集から1年以上経過していることを示します</p>
<h2 id="suppress">オーバーサイト(suppress)</h2>
<div class="table-wrap">
<table>
<tr><th>利用者</th><th>最終編集日時</th></tr>
<tr><td><a href='https://ja.wikipedia.org/wiki/利用者:Ohgi'>Ohgi</a></td><td>2026-07-09 09:10:08 UTC</td></tr>
<tr><td><a href='https://ja.wikipedia.org/wiki/利用者:Infinite0694'>Infinite0694</a></td><td>2026-07-03 16:41:27 UTC</td></tr>
<tr><td><a href='https://ja.wikipedia.org/wiki/利用者:W.CC'>W.CC</a></td><td>2026-07-02 14:27:57 UTC</td></tr>
</table>
</div>
</div>
</div>
</body>
</html>
