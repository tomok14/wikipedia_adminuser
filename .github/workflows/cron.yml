name: make report

on:
  schedule:
    # 毎日 00:00 UTC (09:00 JST)
    - cron: "0 0 * * *"
    # 毎月1日 00:00 UTC (09:00 JST)
    # - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  make_report_cron:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Git 設定
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: タグ作成
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')"

          # すでにタグが存在する場合は時分秒を付与
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="v$(date +'%Y.%m.%d-%H%M%S')"
          fi

          #TAG="v$(date +'%Y.%m.%d-%H%M%S')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Python をセットアップ
        uses: actions/setup-python@v6

      - name: Python ライブラリをセットアップ
        run: |
          sudo apt update

      - name: コマンドをセットアップ
        run: |
          sudo apt update
          sudo apt install -y mailutils

      - name: make report
        run: |
          python admin.py

      # 生成したファイルをコミット＆プッシュ
      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated File Generation"
          file_pattern: "report.html" # 対象ファイル（すべて指定する場合は '.'）

      - name: Upload binaries to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          artifacts: report.html
          bodyFile: body.md

      #- name: Send mail (SMTP Action)
      #  uses: dawidd6/action-send-mail@v3
      #  with:
      #    server_address: smtp.example.com
      #    server_port: 587
      #    username: ${{ secrets.SMTP_USERNAME }}
      #    password: ${{ secrets.SMTP_PASSWORD }}
      #    subject: Test
      #    body: Hello
      #    to: user@example.com
      #    from: GitHub Actions

      - name: Prepare Pages
        run: |
          mkdir public
          cp report.html public/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - uses: actions/deploy-pages@v4

      - name: Send mail (mail command)
        run: |
          echo "${{ secrets.EMAIL }}"
          echo test | mail -s "test" "${{ secrets.EMAIL }}"
